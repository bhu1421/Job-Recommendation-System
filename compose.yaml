services:
  recommender:
    container_name: job-recommendation-system
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./job_recommender.joblib:/app/job_recommender.joblib:ro
      - ./outputs:/app/outputs
      - job_dataset_cache:/data
    environment:
      STREAMLIT_SERVER_ADDRESS: 0.0.0.0
      STREAMLIT_SERVER_PORT: 8501
      JOB_DATA_DIR: /data
      KAGGLE_API_TOKEN: ${KAGGLE_API_TOKEN:-}

volumes:
  job_dataset_cache:
