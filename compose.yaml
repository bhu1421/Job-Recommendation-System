services:
  recommender:
    container_name: job-recommendation-system
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./job_recommender.joblib:/app/job_recommender.joblib:ro
      - ./job_descriptions.csv:/app/job_descriptions.csv:ro
      - ./outputs:/app/outputs
    environment:
      STREAMLIT_SERVER_ADDRESS: 0.0.0.0
      STREAMLIT_SERVER_PORT: 8501
